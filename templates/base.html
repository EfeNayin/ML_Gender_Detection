<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cinsiyet Tespiti{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2f3f5;
      --card: #ffffff;
      --ink: #14161a;
      --mid: #6b7280;
      --rule: #d8dbe0;
      --male: #00b8b8;
      --female: #c400c4;
      --alert: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ---- Başlık ---- */
    header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 18px;
      margin-bottom: 36px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
      margin: 0 0 6px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.02;
      margin: 0;
    }

    .pipeline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--mid);
      margin-top: 12px;
    }

    .pipeline span { white-space: nowrap; }

    /* ---- Kartlar ---- */
    .card {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 24px;
    }

    h2 {
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      margin: 0 0 16px;
    }

    /* ---- Form ---- */
    .field {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input[type="file"] {
      flex: 1 1 240px;
      min-width: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px dashed var(--rule);
      background: var(--paper);
    }

    input[type="file"]::file-selector-button {
      font-family: 'Archivo', sans-serif;
      font-weight: 500;
      font-size: 13px;
      margin-right: 12px;
      padding: 8px 14px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    button[type="submit"] {
      font-family: 'Archivo', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 28px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button[type="submit"]:hover { opacity: 0.82; }

    :focus-visible {
      outline: 3px solid var(--male);
      outline-offset: 2px;
    }

    .hint {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--mid);
      margin: 14px 0 0;
    }

    .alert {
      margin-top: 20px;
      padding: 14px 16px;
      border-left: 3px solid var(--alert);
      background: #fff;
      color: var(--alert);
      font-size: 14px;
    }

    footer {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--mid);
    }

    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Görüntü işleme · makine öğrenmesi</p>
      <h1>{% block heading %}Cinsiyet Tespiti{% endblock %}</h1>
      <p class="pipeline">
        <span>Haar Cascade</span> → <span>100×100 gri</span> →
        <span>PCA (50 bileşen)</span> → <span>SVM</span>
      </p>
    </header>

    {% block content %}{% endblock %}

    <footer>ML_Gender_Detection · yerel geliştirme sunucusu</footer>
  </div>
</body>
</html>
